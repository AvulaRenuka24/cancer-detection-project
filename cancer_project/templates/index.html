<!DOCTYPE html>
<html>
<head>
    <title>Cancer Detection</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            background: white;
            color: black;
            width: 400px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
        }

        img {
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>🩺 Cancer Detection System</h2>

    <button onclick="fillData()">Fill Sample Data</button>

    <form action="/predict" method="post">

        {% for i in range(30) %}
            <input type="text" name="f{{i}}" placeholder="Feature {{i}}" required><br>
        {% endfor %}

        <button type="submit">Predict</button>
    </form>

    <div class="result">
        <p>{{ prediction_text }}</p>
        <p>{{ risk_text }}</p>
        <p>{{ prob_text }}</p>
    </div>

    <img src="/static/graph.png" width="300">

</div>

<script>
function fillData() {
    let values = [
        17.99,10.38,122.8,1001,0.1184,0.2776,0.3001,0.1471,0.2419,0.07871,
        1.095,0.9053,8.589,153.4,0.006399,0.04904,0.05373,0.01587,0.03003,0.006193,
        25.38,17.33,184.6,2019,0.1622,0.6656,0.7119,0.2654,0.4601,0.1189
    ];

    let inputs = document.querySelectorAll("input");

    for (let i = 0; i < inputs.length; i++) {
        inputs[i].value = values[i];
    }
}
</script>

</body>
</html>
